# Hand-curated catalog behind the project index in the workspace README.
#
# meta/bin/gen-readme-index walks the domain folders, matches each project against this file and
# rewrites the block between the project-index markers in README.md. A project found on disk but
# missing here is still listed (with its README's opening line) and reported, so new projects show
# up without anyone remembering to add them.
#
# [domains.<folder>]      title, blurb             heading and one-line intro per domain
# [projects."<path>"]     summary                  one line, what it is
#                         private = true           remote repo is private: 🔒, no link
#                         featured = true          also listed under Highlights
#                         stack = "..."            shown for featured projects
#                         live = "https://..."     public URL, featured only
#                         hidden = true            keep it off the README entirely
#
# private/, archive/ and docs/ are never walked.

# Domain order here is the order in the README.
[domains.automotive]
title = "Automotive"
blurb = "Vehicle parts data: interchange, junkyard inventory, OEM catalogue scrapers."

[domains.web-scrapers]
title = "Web scraping"
blurb = "The shared scraping platform (cache, permits, egress, scheduling) and non-automotive scrapers."

[domains.robotics]
title = "Robotics & 3D scanning"
blurb = "LiDAR and structured-light scanners, robot data pipelines, mapping."

[domains.drones]
title = "Drones"
blurb = "Multirotor and surface craft: build docs, flight logs, tuning tools and a build simulator."

[domains.embedded]
title = "Embedded"
blurb = "Firmware, CAN/DBC tooling, GNSS and sensor hardware."

[domains.apps]
title = "Apps"
blurb = "End-user web and desktop apps."

[domains.media]
title = "Media"
blurb = "Photo and video library management."

[domains.ai]
title = "AI & ML"
blurb = "Image analysis, face grouping, local models, simulation."

[domains.messaging]
title = "Messaging & streaming"
blurb = "Pub/sub tooling, performance testing and stream-processing experiments."

[domains.infra]
title = "Infrastructure"
blurb = "The home k3s cluster, GitOps, networking and observability."

[domains.games]
title = "Games"
blurb = "Godot projects."

[domains.tools]
title = "Tools"
blurb = "Standalone utilities, CLIs and editor/browser extensions."

[domains.meta]
title = "Meta"
blurb = "Agent skills, workspace tooling and documentation tooling."

[domains.experiments]
title = "Experiments"
blurb = "POCs and sandboxes kept for reference."

