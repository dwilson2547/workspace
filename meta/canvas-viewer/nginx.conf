server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # The page is one file with inline <script>/<style> and no external resources.
    # connect-src 'self' is the point: ?src= can only load .canvas files served from
    # this origin, so a link can't make the viewer display someone else's content.
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
