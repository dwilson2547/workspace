apiVersion: batch/v1
kind: Job
metadata:
  name: gpu-burn-test
  namespace: default
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: burn
          image: pytorch/pytorch:2.5.1-cuda12.4-cudnn9-runtime
          resources:
            limits:
              nvidia.com/gpu: 1
          env:
            - name: BURN_SECONDS
              value: "300"
          command: ["python", "-c"]
          args:
            - |
              import os, time, torch
              assert torch.cuda.is_available(), "no CUDA device visible"
              d = torch.device("cuda")
              print("device:", torch.cuda.get_device_name(d), flush=True)
              n = 8192
              a = torch.randn(n, n, device=d, dtype=torch.float16)
              b = torch.randn(n, n, device=d, dtype=torch.float16)
              # extra allocation so the memory side gets exercised too
              ballast = torch.empty(int(6e9) // 2, device=d, dtype=torch.float16)
              print(f"allocated {torch.cuda.memory_allocated(d)/1e9:.1f} GB", flush=True)
              end = time.time() + int(os.environ["BURN_SECONDS"])
              while time.time() < end:
                  torch.cuda.synchronize(); t0 = time.time(); iters = 0
                  while time.time() - t0 < 10:
                      c = a @ b; iters += 1
                  torch.cuda.synchronize(); dt = time.time() - t0
                  tflops = 2 * n**3 * iters / dt / 1e12
                  print(f"{tflops:6.1f} TFLOPS fp16  ({iters} matmuls in {dt:.1f}s)", flush=True)
              print("done", flush=True)
