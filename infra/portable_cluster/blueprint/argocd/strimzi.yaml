# Strimzi operator (Kafka on K8s), pinned to 1.3.0. Watches the `kafka`
# namespace (chart default: its own namespace). CRDs ship in the chart's
# crds/ dir, which ArgoCD applies without pruning.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: strimzi
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/strimzi/strimzi-kafka-operator.git
    targetRevision: 1.3.0
    path: helm-charts/helm3/strimzi-kafka-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
