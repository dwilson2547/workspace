# The Kafka cluster CR itself (kafka/cluster.yaml) plus any KafkaTopic CRs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/vmk8_cluster_config.git
    targetRevision: main
    path: kafka
    # Without recurse, directory apps do NOT include subdirectories
    # (kafka/topics/ stayed invisible until this was set).
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: kafka
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - CreateNamespace=true
