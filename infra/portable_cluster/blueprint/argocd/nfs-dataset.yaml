apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nfs-dataset
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/vmk8_cluster_config.git
    targetRevision: main
    path: storage
  destination:
    server: https://kubernetes.default.svc
    # StorageClass is cluster-scoped; the namespace is only a formality.
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
