apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: garage-webui
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/dwilson2547/vmk8_cluster_config.git
    targetRevision: main
    path: garage-webui
  destination:
    server: https://kubernetes.default.svc
    namespace: garage
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
