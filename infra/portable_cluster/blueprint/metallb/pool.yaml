# vmk8 LoadBalancer address range, announced on the LAN via L2 (ARP).
# Disjoint by design from the physical cluster's pool (192.168.0.60-85,
# infra/cluster-config/metallb/pool.yaml) and from the vmk8 node addresses
# (192.168.0.90-94, assigned at the router). Traefik holds .95 (pinned in
# traefik/values.yaml).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: vmk8-dev-pool
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  addresses:
    - 192.168.0.95-192.168.0.99
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: vmk8-dev-advertisement
  namespace: metallb-system
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
