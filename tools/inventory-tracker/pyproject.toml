[project]
name = "inventory-tracker"
version = "0.1.0"
description = "AI-assisted purchase + component inventory tracker"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
inv = "inv.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["inv"]
