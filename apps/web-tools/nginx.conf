server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    absolute_redirect off;

    # Scripts and styles are inline or vendored under /vendor/; only Google Fonts is external.
    # img-src allows OSM tiles (geojson-editor). connect-src is open because oauth-token posts to
    # whatever token endpoint the user enters and geojson-editor queries nominatim.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org; connect-src *; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    # Origin only, cross-site. OSM tiles/nominatim reject requests without a Referer (tile usage policy).
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        index index.html;
        try_files $uri $uri/ =404;
    }
}
