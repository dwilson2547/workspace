; CL35 ToF -> ArduPilot proximity bridge
; Spec: ../../CL35 tof proximity handoff.md

[env:esp32s3zero]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; Waveshare ESP32-S3-Zero is an ESP32-S3FH4R2: 4MB flash, 2MB in-package PSRAM.
; PSRAM is not used by this firmware.
board_upload.flash_size = 4MB
board_build.partitions  = default.csv

; The S3-Zero has no USB-UART bridge -- the USB port is the S3's native
; USB-Serial-JTAG. ARDUINO_USB_CDC_ON_BOOT makes `Serial` that port, which
; keeps GP43/GP44 (UART0, the ROM boot log) and Serial1 (the FC link) clear.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Wall
    ; The generated MAVLink headers are packed structs throughout; the warning is
    ; expected there and drowns out our own build output.
    -Wno-address-of-packed-member

lib_deps =
    pololu/VL53L1X @ ^1.3.1
    https://github.com/mavlink/c_library_v2.git

monitor_speed = 115200
